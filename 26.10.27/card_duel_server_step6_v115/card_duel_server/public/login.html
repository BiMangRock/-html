<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>카드 결투 — 로그인</title>
<style>
:root{ --felt:#14121f; --felt2:#1c1930; --gold:#c9a227; --gold-d:#8a6f1c; --parch:#ede3c8; --parch-d:#c9bd9c; --ember:#b23a2e; --teal-l:#6fc2ba;
  --font-d:'Cormorant Garamond',Georgia,serif; --font-u:system-ui,sans-serif; }
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{background:radial-gradient(ellipse at center,var(--felt2),var(--felt) 70%); color:var(--parch); font-family:var(--font-u);
  display:flex; align-items:center; justify-content:center; padding:1rem;}
.box{width:100%; max-width:380px; background:linear-gradient(180deg,#241f38,#181428); border:1px solid var(--gold-d); border-radius:12px; padding:1.6rem 1.5rem 1.4rem; box-shadow:0 10px 40px rgba(0,0,0,.5);}
h1{font-family:var(--font-d); color:var(--gold); text-align:center; margin:.1rem 0 1.1rem; font-size:2rem; font-weight:600; letter-spacing:.04em;}
.tabs{display:flex; margin-bottom:1.1rem; border-bottom:1px solid var(--gold-d);}
.tabs button{flex:1; background:none; border:none; color:var(--parch-d); padding:.6rem 0; font-size:1rem; cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-1px;}
.tabs button.on{color:var(--gold); border-bottom-color:var(--gold);}
label{display:block; font-size:.82rem; color:var(--parch-d); margin:.8rem 0 .3rem;}
input{width:100%; padding:.65rem .75rem; font-size:1rem; background:#100e1a; color:var(--parch); border:1px solid #4a4160; border-radius:6px; outline:none;}
input:focus{border-color:var(--gold);}
.hint{font-size:.74rem; color:#8f86a6; margin-top:.3rem;}
.err{min-height:1.3rem; margin:.9rem 0 .2rem; color:#ff8f84; font-size:.88rem;}
.go{width:100%; padding:.75rem; font-size:1.05rem; font-weight:600; color:#1b1608; background:linear-gradient(180deg,#e2c25a,var(--gold)); border:1px solid var(--gold-d); border-radius:6px; cursor:pointer;}
.go:disabled{opacity:.55; cursor:default;}
.only-signup{display:none;}
form.signup .only-signup{display:block;}
</style>
</head>
<body>
<div class="box">
  <h1>카드 결투</h1>
  <div class="tabs">
    <button type="button" id="tabLogin" class="on">로그인</button>
    <button type="button" id="tabSignup">회원가입</button>
  </div>
  <form id="form" autocomplete="on">
    <label for="username">아이디</label>
    <input id="username" name="username" autocomplete="username" maxlength="16" autofocus required>
    <div class="hint only-signup">3~16자, 한글·영문·숫자·밑줄(_)</div>
    <label for="password">비밀번호</label>
    <input id="password" name="password" type="password" autocomplete="current-password" maxlength="72" required>
    <div class="hint only-signup">8자 이상</div>
    <div class="only-signup">
      <label for="password2">비밀번호 확인</label>
      <input id="password2" type="password" autocomplete="new-password" maxlength="72">
    </div>
    <div class="err" id="err" role="alert"></div>
    <button class="go" id="go" type="submit">로그인</button>
  </form>
</div>
<script src="/js/login.js"></script>
</body>
</html>
