<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>카드 결투</title>
<style>
:root{
  --felt:#14121f; --felt2:#1c1930; --gold:#c9a227; --gold-d:#8a6f1c;
  --parch:#ede3c8; --parch-d:#c9bd9c; --ink:#2a2417;
  --ember:#b23a2e; --teal:#3d8c86; --teal-l:#6fc2ba;
  --hp:#8a2e2e; --font-d:'Cormorant Garamond',Georgia,serif; --font-u:system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background:radial-gradient(ellipse at center, var(--felt2), var(--felt) 70%);
  font-family:var(--font-u); color:var(--parch); overflow-x:hidden;
  display:flex; flex-direction:row; min-height:100%;
}
.main{flex:1; display:flex; flex-direction:column; min-width:0;}
h1{font-family:var(--font-d); font-weight:600; font-size:1.4rem; margin:.6rem 1rem; color:var(--gold); letter-spacing:.02em;}
.board{flex:1; display:flex; flex-direction:column; justify-content:space-between; padding:.5rem 1rem; gap:.4rem;}
.row{display:flex; align-items:center; gap:.6rem;}
.hero{
  display:flex; align-items:center; gap:.5rem; padding:.4rem .7rem;
  background:linear-gradient(180deg,#241f38,#181428); border:1px solid var(--gold-d); border-radius:6px;
  min-width:140px;
}
.hero .name{font-family:var(--font-d); font-size:1.05rem; color:var(--gold);}
.hp{color:var(--hp); font-weight:700;}
.mana{color:var(--teal-l); font-weight:700; font-size:.85rem;}
.pile{font-size:.68rem; color:var(--parch-d);}
.crystals{display:flex; gap:3px; flex-wrap:wrap; max-width:120px;}
.crystal{width:10px; height:10px; background:var(--teal); border-radius:2px; box-shadow:0 0 3px var(--teal-l);}
.crystal.empty{background:#2a2a3a;}
.zone{
  flex:1; min-height:110px; display:flex; gap:.5rem; align-items:center; justify-content:center;
  border-top:1px solid rgba(201,162,39,.15); border-bottom:1px solid rgba(201,162,39,.15);
  padding:.4rem; flex-wrap:wrap;
}
.card{
  width:92px; height:128px; background:linear-gradient(160deg,var(--parch),var(--parch-d));
  border:2px solid var(--ink); border-radius:8px; color:var(--ink); position:relative;
  display:flex; flex-direction:column; justify-content:space-between; padding:.3rem;
  cursor:pointer; transition:transform .12s ease, box-shadow .12s ease, opacity .3s ease; user-select:none; flex-shrink:0;
}
.card:hover{transform:translateY(-6px); box-shadow:0 6px 14px rgba(0,0,0,.5);}
.card.selected{outline:3px solid var(--teal-l); transform:translateY(-8px);}
.card.attackable{outline:2px dashed var(--ember);}
.card.sick::after{content:"휴식"; position:absolute; bottom:24px; right:4px; font-size:.55rem; color:#7a6f4d; font-weight:700;}
.card.dead{opacity:0; transform:scale(.3); pointer-events:none;}
.card .cname{font-family:var(--font-d); font-weight:700; font-size:.76rem; line-height:1.05; text-align:center;}
.card .effect{font-size:.55rem; line-height:1.1; text-align:center; color:#5a4f30; min-height:1.6em;}
.cost{
  position:absolute; top:-8px; left:-8px; width:22px; height:22px; border-radius:50%;
  background:var(--teal); color:#fff; font-weight:700; font-size:.75rem;
  display:flex; align-items:center; justify-content:center; border:2px solid var(--felt);
}
.stats{display:flex; justify-content:space-between; font-weight:700; font-size:.85rem;}
.atk{color:#7a3a10;} .life{color:var(--hp);}
.tag{display:inline-block; font-size:.5rem; font-weight:700; padding:0 3px; border-radius:3px; margin:0 1px;}
.tag.taunt{background:#5a3d1a; color:#f0c869;}
.tag.shield{background:#1a4a5a; color:#8fd8f0;}
.card.taunt{border-color:var(--gold);}
.card.shielded{box-shadow:0 0 8px var(--teal-l);}
.card.targetable{outline:2px dashed var(--gold); box-shadow:0 0 10px rgba(201,162,39,.6); cursor:pointer;}
.hero.targetable{outline:2px dashed var(--gold); box-shadow:0 0 10px rgba(201,162,39,.6); cursor:pointer;}
.hand{display:flex; gap:.5rem; justify-content:center; padding:.6rem 0 calc(.6rem + env(safe-area-inset-bottom,0px)); min-height:130px;}
.hand .card.unaffordable{filter:grayscale(.7) brightness(.7); cursor:not-allowed;}
.controls{display:flex; justify-content:center; gap:.6rem; padding:.4rem;}
button.end-turn{
  background:var(--gold); color:var(--ink); border:none; padding:.55rem 1.4rem; border-radius:5px;
  font-weight:700; font-size:.95rem; cursor:pointer; font-family:var(--font-u);
}
button.end-turn:disabled{opacity:.4; cursor:not-allowed;}
#logPanel{
  width:190px; flex-shrink:0; background:rgba(0,0,0,.35); border-left:1px solid rgba(201,162,39,.25);
  padding:.6rem .5rem calc(.6rem + env(safe-area-inset-bottom,0px));
  padding-top:calc(.6rem + env(safe-area-inset-top,0px));
  display:flex; flex-direction:column;
}
#logPanel h3{font-family:var(--font-d); font-size:.85rem; color:var(--gold); margin:0 0 .4rem .2rem; font-weight:600;}
#logList{flex:1; overflow-y:auto; display:flex; flex-direction:column-reverse; gap:.3rem;}
#logList div{font-size:.72rem; line-height:1.3; color:var(--parch-d); border-bottom:1px solid rgba(255,255,255,.06); padding-bottom:.25rem;}
#logList div:first-child{color:var(--parch);}
@media (max-width:640px){
  body{flex-direction:column;}
  #logPanel{width:100%; height:90px; border-left:none; border-top:1px solid rgba(201,162,39,.25);}
  #logList{flex-direction:column-reverse;}
}
#overlay{
  position:fixed; inset:0; background:rgba(10,8,18,.9); display:none; align-items:center; justify-content:center;
  flex-direction:column; gap:1rem; z-index:10;
}
#overlay.show{display:flex;}
#overlay h2{font-family:var(--font-d); font-size:2.2rem; color:var(--gold);}
.label{font-size:.7rem; color:var(--parch-d); text-align:center;}
#arrowSvg{position:fixed; inset:0; width:100vw; height:100vh; pointer-events:none; z-index:15; display:none;}
.card[data-attacking]{position:relative; z-index:20;}
.float{position:fixed; z-index:50; font-weight:800; font-size:1.3rem; pointer-events:none; transform:translate(-50%,-50%);
  text-shadow:0 1px 3px #000; animation:floatUp .9s ease-out forwards;}
.float.dmg{color:#ff6b5b;} .float.heal{color:#7be07b;} .float.buff{color:#f0c869;} .float.shield{color:#8fd8f0;}
@keyframes floatUp{from{opacity:1; margin-top:0;} to{opacity:0; margin-top:-46px;}}
.badge{font-family:var(--font-u); font-size:.7rem; font-weight:600; color:var(--teal-l); border:1px solid var(--teal); border-radius:999px; padding:.1rem .55rem; margin-left:.5rem; vertical-align:middle;}
/* ---- 시작 메뉴 ---- */
#menu{position:fixed; inset:0; z-index:30; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(ellipse at center, var(--felt2), var(--felt) 70%); padding:1rem;}
#menu.hidden{display:none;}
.screen{display:none; flex-direction:column; align-items:center; gap:.9rem; width:100%; max-width:360px; text-align:center;}
.screen.show{display:flex;}
.screen h2{font-family:var(--font-d); font-size:2.4rem; font-weight:600; color:var(--gold); margin:0 0 .4rem; letter-spacing:.02em;}
.screen h3{font-family:var(--font-d); font-size:1.5rem; font-weight:600; color:var(--gold); margin:0 0 .4rem;}
.screen p.sub{margin:0 0 .4rem; font-size:.8rem; color:var(--parch-d);}
.menu-btn{width:100%; background:linear-gradient(180deg,#2a2444,#1c1830); color:var(--parch); border:1px solid var(--gold-d);
  border-radius:8px; padding:.8rem 1rem; font-size:1rem; font-weight:700; font-family:var(--font-u); cursor:pointer; text-align:left;
  transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;}
.menu-btn:hover:not(:disabled){transform:translateY(-2px); border-color:var(--gold); box-shadow:0 4px 12px rgba(0,0,0,.45);}
.menu-btn .desc{display:block; margin-top:.2rem; font-size:.74rem; font-weight:400; color:var(--parch-d);}
.menu-btn.primary{background:var(--gold); color:var(--ink); text-align:center; font-size:1.1rem; border:none;}
.menu-btn.primary:hover:not(:disabled){box-shadow:0 4px 14px rgba(201,162,39,.45);}
.menu-btn.back{background:transparent; text-align:center; font-weight:600; font-size:.88rem; border-color:rgba(201,162,39,.35); color:var(--parch-d);}
.menu-btn:disabled{opacity:.45; cursor:not-allowed;}
.menu-btn .soon{float:right; font-size:.68rem; font-weight:600; color:var(--parch-d); border:1px solid var(--parch-d); border-radius:999px; padding:0 .45rem;}
/* ---- 덱 보기 ---- */
button.end-turn.sub{background:transparent; color:var(--gold); border:1px solid var(--gold-d);}
button.end-turn.sub.armed{background:var(--ember); color:#fff; border-color:var(--ember);}
#deckModal{position:fixed; inset:0; z-index:25; background:rgba(10,8,18,.88); display:none; align-items:center; justify-content:center; padding:1rem;}
#deckModal.show{display:flex;}
.deck-panel{background:linear-gradient(180deg,#241f38,#181428); border:1px solid var(--gold-d); border-radius:10px;
  width:min(860px,100%); max-height:88vh; display:flex; flex-direction:column; padding:1rem;}
.deck-head{display:flex; justify-content:space-between; align-items:center; gap:1rem;}
.deck-head h3{font-family:var(--font-d); color:var(--gold); margin:0; font-size:1.3rem; font-weight:600;}
.deck-panel p.note{margin:.3rem 0 .6rem; font-size:.74rem; color:var(--parch-d);}
.deck-grid{display:flex; flex-wrap:wrap; gap:.9rem .7rem; justify-content:center; overflow-y:auto; padding:.7rem .4rem;}
.deck-grid .card{cursor:default;}
.deck-grid .card.drawn{filter:grayscale(.85) brightness(.55);}
.copies{position:absolute; top:-8px; right:-8px; min-width:30px; height:22px; padding:0 5px; border-radius:11px; background:var(--gold); color:var(--ink);
  font-weight:800; font-size:.72rem; display:flex; align-items:center; justify-content:center; border:2px solid var(--felt2);}
.deck-grid .card.drawn .copies{background:#555; color:#ccc;}
/* ---- 골드 / 보상 ---- */
.wallet{display:inline-block; font-family:var(--font-u); font-size:.78rem; font-weight:700; color:var(--gold); border:1px solid var(--gold-d);
  border-radius:999px; padding:.1rem .65rem; margin-left:.5rem; vertical-align:middle; background:rgba(0,0,0,.25);}
#menuWallet{position:fixed; top:calc(.8rem + env(safe-area-inset-top,0px)); right:1rem; margin:0; font-size:.9rem;}
.notice{font-size:.74rem; color:var(--parch-d); margin:0;}
.notice.warn{color:#e08a7f;}
.bet-box{width:100%; background:rgba(0,0,0,.28); border:1px solid var(--gold-d); border-radius:8px; padding:.8rem; display:flex; flex-direction:column; gap:.6rem; text-align:left;}
.bet-box .row2{display:flex; justify-content:space-between; font-size:.82rem; color:var(--parch-d);}
.bet-box .row2 b{color:var(--parch);}
.bet-box input[type=number]{width:100%; background:#120f1e; color:var(--parch); border:1px solid var(--gold-d); border-radius:6px; padding:.5rem; font-size:1.05rem; font-weight:700; text-align:center;}
.bet-box input[type=range]{width:100%; accent-color:var(--gold);}
.bet-quick{display:flex; gap:.4rem;}
.bet-quick button{flex:1; background:transparent; color:var(--gold); border:1px solid var(--gold-d); border-radius:5px; padding:.35rem 0; font-size:.78rem; font-weight:700; cursor:pointer;}
.bet-result{font-size:.8rem; text-align:center; color:var(--parch-d);}
.bet-result .win{color:var(--teal-l); font-weight:700;} .bet-result .lose{color:#e08a7f; font-weight:700;}
/* ---- 상대 손패(뒷면만) ---- */
.ai-hand{display:flex; justify-content:center; align-items:flex-start; height:46px; overflow:visible; padding:0 .5rem;}
.card-back{width:34px; height:48px; flex:0 0 auto; margin-left:-12px; border-radius:5px; border:2px solid var(--gold-d);
  background:radial-gradient(circle at 50% 50%, var(--gold-d) 0 5px, transparent 6px),
             repeating-linear-gradient(45deg,#2a2444 0 5px,#1c1830 5px 10px);
  box-shadow:0 2px 4px rgba(0,0,0,.5); transform:translateY(-6px);}
.card-back:first-child{margin-left:0;}
/* ---- 배당 / 치트 ---- */
.tier-toggle{display:flex; gap:.35rem;}
.tier-toggle button{flex:1; background:transparent; color:var(--parch-d); border:1px solid var(--gold-d); border-radius:5px; padding:.45rem 0; font-size:.82rem; font-weight:700; cursor:pointer;}
.tier-toggle button.on{background:var(--gold); color:var(--ink); border-color:var(--gold);}
.cheat-info{font-size:.74rem; color:var(--parch-d); line-height:1.45;}
.cheat-info .chip, .cheats .chip{display:inline-block; font-size:.68rem; border:1px solid var(--ember); color:#e8a79e; border-radius:999px; padding:.05rem .5rem; margin:.15rem .15rem 0 0;}
.cheats{min-width:140px; text-align:right; max-width:60%;}
.cheats .chip{cursor:help;}
#overlayReward{font-size:1.05rem; font-weight:700; text-align:center; line-height:1.6; margin:0;}
#overlayReward .sub2{display:block; font-size:.8rem; font-weight:400; color:var(--parch-d);}
#overlayReward .plus{color:var(--teal-l);} #overlayReward .minus{color:#e08a7f;}
</style>
</head>
<body>
<svg id="arrowSvg"><defs><marker id="arrowhead" markerWidth="10" markerHeight="9" refX="7" refY="4.5" orient="auto"><polygon points="0 0,10 4.5,0 9" style="fill:var(--ember)"/></marker></defs>
<line id="arrowLine" x1="0" y1="0" x2="0" y2="0" style="stroke:var(--ember); stroke-width:4; marker-end:url(#arrowhead);"/></svg>
<div class="main">
<h1>카드 결투<span class="badge" id="diffBadge"></span><span class="wallet walletView"></span></h1>
<div class="board">
  <div class="row" style="justify-content:space-between;">
    <div class="hero" id="aiHero">
      <div>
        <div class="name">상대</div>
        <div class="hp">체력 <span id="aiHp"></span></div>
        <div class="mana"><span id="aiManaText"></span></div>
        <div class="crystals" id="aiCrystals"></div>
        <div class="pile">손패 <span id="aiHandCnt"></span> · 덱 <span id="aiDeckCnt"></span></div>
      </div>
    </div>
    <div class="label">상대 필드</div>
    <div class="cheats" id="aiCheats"></div>
  </div>
  <div class="ai-hand" id="aiHand" title="상대 손패"></div>
  <div class="zone" id="aiZone"></div>
  <div class="zone" id="playerZone"></div>
  <div class="row" style="justify-content:space-between;">
    <div class="hero" id="playerHero">
      <div>
        <div class="name">나</div>
        <div class="hp">체력 <span id="playerHp"></span></div>
        <div class="mana"><span id="manaText"></span></div>
        <div class="crystals" id="crystals"></div>
        <div class="pile">덱 <span id="myDeckCnt"></span></div>
      </div>
    </div>
    <div class="label">내 필드</div>
    <div style="min-width:140px;"></div>
  </div>
</div>
<div class="controls"><button class="end-turn sub" id="deckBtn" onclick="openDeck()">덱 보기</button><button class="end-turn sub" id="surrenderBtn">항복</button><button class="end-turn" id="endTurnBtn">턴 종료</button></div>
<div class="hand" id="hand"></div>
</div>
<aside id="logPanel"><h3>전투 기록</h3><div id="logList"></div></aside>
<div id="overlay"><h2 id="overlayText"></h2><p id="overlayReward"></p><button class="end-turn" onclick="goToMenu()">처음 화면으로</button></div>

<div id="deckModal" onclick="if(event.target===this) closeDeck()">
  <div class="deck-panel">
    <div class="deck-head"><h3 id="deckTitle"></h3><button class="end-turn sub" onclick="closeDeck()">닫기</button></div>
    <p class="note">카드 위 숫자는 (덱에 남은 장수 / 덱에 넣은 장수)입니다. 모두 뽑은 카드는 어둡게 표시되고, 뽑는 순서는 알 수 없습니다.</p>
    <div class="deck-grid" id="deckGrid"></div>
  </div>
</div>

<div id="menu">
  <span class="wallet walletView" id="menuWallet"></span>
  <div class="screen show" id="screen-main">
    <h2>카드 결투</h2>
    <p class="sub">턴제 카드 대전</p>
    <button class="menu-btn primary" onclick="showScreen('mode')">게임 시작</button>
  </div>
  <div class="screen" id="screen-mode">
    <h3>모드 선택</h3>
    <button class="menu-btn" onclick="showScreen('difficulty')">AI 대전<span class="desc">컴퓨터 상대와 1대1로 대전합니다.</span></button>
    <button class="menu-btn back" onclick="showScreen('main')">뒤로</button>
  </div>
  <div class="screen" id="screen-difficulty">
    <h3>난이도 선택</h3>
    <div id="difficultyList" style="display:flex; flex-direction:column; gap:.9rem; width:100%;"></div>
    <button class="menu-btn back" onclick="showScreen('mode')">뒤로</button>
  </div>
  <div class="screen" id="screen-playmode">
    <h3>중급 AI — 방식 선택</h3>
    <button class="menu-btn" id="btnNormalMode" onclick="startGame('normal',{mode:'normal'})"></button>
    <button class="menu-btn" id="btnBetMode" onclick="openBetScreen()"></button>
    <button class="menu-btn back" onclick="showScreen('difficulty')">뒤로</button>
  </div>
  <div class="screen" id="screen-bet">
    <h3>배팅 설정</h3>
    <div class="bet-box">
      <div class="row2"><span>보유 골드</span><b id="betGold"></b></div>
      <div class="row2"><span>최대 배팅</span><b id="betMax"></b></div>
      <div class="row2"><span>배당 선택</span><b id="betTierLabel"></b></div>
      <div class="tier-toggle" id="tierToggle"></div>
      <div class="cheat-info" id="cheatInfo"></div>
      <input type="number" id="betInput" inputmode="numeric" step="1">
      <input type="range" id="betRange" step="1">
      <div class="bet-quick">
        <button onclick="setBet('min')">최소</button><button onclick="setBet(0.25)">25%</button><button onclick="setBet(0.5)">50%</button><button onclick="setBet('max')">전액</button>
      </div>
      <div class="bet-result" id="betResult"></div>
    </div>
    <p class="notice warn">배팅 금액은 게임 시작 즉시 차감됩니다. 도중에 나가면 돌려받을 수 없습니다. 배당 200% 이상은 게임 시작 때 상대 AI에게 치트가 추첨됩니다.</p>
    <button class="menu-btn primary" id="betGo" onclick="confirmBet()">배팅하고 시작</button>
    <button class="menu-btn back" onclick="showScreen('playmode')">뒤로</button>
  </div>
</div>

<!-- =====================================================================
     [1] 룰 엔진 (DOM·전역 가변 상태 없음)
     - 이 블록은 화면을 전혀 모른다. 서버(Java RuleEngine)로 포팅할 대상.
     - 상태는 apply()가 복제본을 만들어 반환하고, 입력 상태는 절대 수정하지 않는다.
     - 행동은 데이터: {type:'PLAY_CARD',cardId,target} / {type:'ATTACK',attackerId,target} / {type:'END_TURN'} / {type:'SURRENDER'}
     - 대상(target): {kind:'hero',seat} | {kind:'minion',seat,id} | null
     - 결과의 events 는 "무슨 일이 일어났는지" 기록이며, 연출/로그는 이것만 보고 재생한다.
     ===================================================================== -->
<script id="engine">
const CONFIG = {HERO_HP:30, MAX_MANA:10, MAX_HAND:10, MAX_BOARD:7, START_HAND:3, START_HAND_MAX:7, COPIES:2};

const CARD_POOL = [
  {name:"들쥐", cost:1, atk:1, hp:2},
  {name:"책벌레", cost:1, atk:1, hp:1, effect:{type:'draw', value:1}},
  {name:"은빛 신병", cost:1, atk:1, hp:1, shield:true},
  {name:"돌담 견습병", cost:1, atk:1, hp:3, taunt:true},
  {name:"견습 검사", cost:2, atk:2, hp:2},
  {name:"방패병", cost:2, atk:1, hp:4},
  {name:"약초꾼", cost:2, atk:1, hp:3, effect:{type:'heal', value:3}},
  {name:"훈련 교관", cost:2, atk:2, hp:1, effect:{type:'buff', value:1}},
  {name:"빛나는 파수병", cost:2, atk:1, hp:4, taunt:true},
  {name:"매의 눈 궁수", cost:2, atk:2, hp:1, effect:{type:'damage', value:1}},
  {name:"숲 늑대", cost:3, atk:3, hp:3},
  {name:"화염 정령", cost:3, atk:4, hp:2, effect:{type:'damage', value:2}},
  {name:"부족의 주술사", cost:3, atk:2, hp:3, effect:{type:'buff', value:1}},
  {name:"수정 골렘", cost:3, atk:2, hp:4, shield:true},
  {name:"강철 파수대장", cost:3, atk:2, hp:5, taunt:true},
  {name:"떠돌이 치유사", cost:3, atk:2, hp:2, effect:{type:'heal', value:4}},
  {name:"돌 골렘", cost:4, atk:3, hp:6},
  {name:"용병대장", cost:4, atk:4, hp:4, effect:{type:'draw', value:1}},
  {name:"대지 정령", cost:4, atk:4, hp:6, taunt:true},
  {name:"빛의 수호자", cost:4, atk:3, hp:4, shield:true},
  {name:"늙은 사자", cost:5, atk:5, hp:5},
  {name:"벼락 마법사", cost:5, atk:4, hp:4, effect:{type:'damage', value:4}},
  {name:"서리 거인", cost:6, atk:6, hp:7},
  {name:"폭풍 부르는 자", cost:6, atk:5, hp:5, effect:{type:'damage', value:5}},
  {name:"고대 용", cost:7, atk:8, hp:8, effect:{type:'buff', value:2}},
  {name:"고대의 수호룡", cost:7, atk:6, hp:9, taunt:true, shield:true},
];
const EFFECT_TEXT = {
  draw: v=>`전투의 함성: 카드 ${v}장 뽑기`,
  damage: v=>`전투의 함성: 대상에게 ${v} 피해`,
  heal: v=>`전투의 함성: 대상 체력 ${v} 회복`,
  buff: v=>`전투의 함성: 아군 하수인 +${v}/+${v}`,
};
function effectText(c){ return c.effect ? EFFECT_TEXT[c.effect.type](c.effect.value) : ''; }

const other = seat => 1 - seat;
const tkey = t => t ? `${t.kind}:${t.seat}:${t.id ?? ''}` : 'none';
const heroT = seat => ({kind:'hero', seat});
const minionT = (seat, id) => ({kind:'minion', seat, id});
const findMinion = (s, seat, id) => s.seats[seat].board.find(m=>m.id===id);

function shuffle(a, rng){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

// ---- 게임 생성 ----
// opts.mods = [좌석0 치트, 좌석1 치트]. 치트는 좌석에 붙는 데이터일 뿐이고, 비어 있으면 기본 규칙과 완전히 같다.
//   hp(영웅 체력+N) startMana(첫 턴 마나 N) startHand(시작 손패+N, 최대 START_HAND_MAX) startBoard(시작 하수인 N기)
//   costDown(덱 하수인 비용-N) manaBonus(매 턴 추가 마나+N) buff(소환 시 체력 +N) armor(영웅 받는 피해-N)
//   extraDraw(N: 이 좌석의 첫 N턴 동안 매 턴 2장 / true: 영구) doubleBattlecry(true: 전투의 함성 두 번)
function newGame(rng=Math.random, opts={}){
  const s = {turn:0, turnNo:0, over:false, winner:null, nextId:1, seats:[]};
  for(let seat=0; seat<2; seat++){
    const mods={...((opts.mods && opts.mods[seat]) || {})};
    const deck=[];
    CARD_POOL.forEach(c=>{ for(let k=0;k<CONFIG.COPIES;k++) deck.push({...c, cost:Math.max(0, c.cost-(mods.costDown||0)), id:s.nextId++}); });
    shuffle(deck, rng);
    const maxHp=CONFIG.HERO_HP+(mods.hp||0);
    s.seats.push({hp:maxHp, maxHp, mana:0, maxMana:mods.startMana?Math.max(0, mods.startMana-1):0, deck, hand:[], board:[], mods});
  }
  for(let seat=0; seat<2; seat++){
    const P=s.seats[seat];
    drawCards(s, seat, Math.min(CONFIG.START_HAND_MAX, CONFIG.START_HAND+(P.mods.startHand||0)), null);
    for(let k=0;k<(P.mods.startBoard||0) && P.board.length<CONFIG.MAX_BOARD;k++)
      P.board.push({id:s.nextId++, name:'보초병', cost:1, atk:1, hp:2, maxHp:2, attacked:false, summoned:false});
  }
  startTurn(s, 0, []);          // 선공도 정상적으로 턴 시작 처리(마나 1)
  return s;
}

// ---- 내부 변경 함수 (복제본 s 에만 사용) ----
function drawCards(s, seat, n, ev, src){
  const P=s.seats[seat]; let drawn=0, burned=0;
  for(let i=0;i<n && P.deck.length;i++){
    const c=P.deck.pop();
    if(P.hand.length<CONFIG.MAX_HAND){ P.hand.push(c); drawn++; } else burned++;
  }
  if(ev && (drawn||burned)) ev.push({type:'draw', seat, count:drawn, burned, src:src||null});
}
function startTurn(s, seat, ev){
  const P=s.seats[seat];
  s.turn=seat; s.turnNo++;
  P.maxMana=Math.min(CONFIG.MAX_MANA, P.maxMana+1);   // 마나는 플레이어별로 따로 관리
  const md=P.mods||{};
  P.turns=(P.turns||0)+1;                              // 이 좌석이 진행한 턴 수
  P.mana=P.maxMana+(md.manaBonus||0);                 // 추가 마나는 그 턴에만 (최대 마나는 늘리지 않음)
  P.board.forEach(m=>{ m.attacked=false; m.summoned=false; });
  ev.push({type:'turn_start', seat, turnNo:s.turnNo});
  drawCards(s, seat, (md.extraDraw && (md.extraDraw===true || P.turns<=md.extraDraw)) ? 2 : 1, ev);
}
function hurtHero(s, seat, amount, ev, cause, src){
  amount=Math.max(0, amount-((s.seats[seat].mods||{}).armor||0));
  s.seats[seat].hp -= amount;
  ev.push({type:'damage', target:heroT(seat), name:null, amount, absorbed:false, cause, src:src||null});
}
function hurtMinion(s, seat, m, amount, ev, cause, src){
  const target=minionT(seat, m.id);
  if(m.shield){
    m.shield=false;
    ev.push({type:'damage', target, name:m.name, amount:0, absorbed:true, cause, src:src||null});
    return;
  }
  m.hp -= amount;
  ev.push({type:'damage', target, name:m.name, amount, absorbed:false, cause, src:src||null});
}
function sweepDead(s, ev){
  for(const seat of [0,1]){
    const P=s.seats[seat];
    P.board = P.board.filter(m=>{
      if(m.hp>0) return true;
      ev.push({type:'death', seat, id:m.id, name:m.name});
      return false;
    });
  }
}
function checkEnd(s, ev){
  if(s.over) return;
  const d0=s.seats[0].hp<=0, d1=s.seats[1].hp<=0;
  if(d0||d1){
    s.over=true;
    s.winner = (d0&&d1) ? null : (d0 ? 1 : 0);
    ev.push({type:'game_over', winner:s.winner});
  }
}

// ---- 전투의 함성 ----
// 카드를 낼 때 선택 가능한 대상(소환 전 상태 기준). 비어 있으면 대상 없음.
function cardTargets(s, seat, card){
  const e=card.effect; if(!e) return [];
  const mins = sd => s.seats[sd].board.map(m=>minionT(sd, m.id));
  if(e.type==='heal')   return [heroT(seat), ...mins(seat)];
  if(e.type==='buff')   return mins(seat);
  // 피해: 적·아군 모두 대상 가능 (소환 전 상태 기준이라 방금 낸 자기 자신은 대상이 아님)
  if(e.type==='damage') return [heroT(other(seat)), ...mins(other(seat)), heroT(seat), ...mins(seat)];
  return [];   // draw
}
function battlecry(s, seat, m, target, ev){
  const e=m.effect; if(!e) return;
  const src={seat, name:m.name};
  if(e.type==='draw'){ drawCards(s, seat, e.value, ev, src); return; }
  if(!target){ ev.push({type:'ignored', seat, src}); return; }
  if(e.type==='damage'){
    if(target.kind==='hero') hurtHero(s, target.seat, e.value, ev, 'battlecry', src);
    else { const t=findMinion(s, target.seat, target.id); if(t) hurtMinion(s, target.seat, t, e.value, ev, 'battlecry', src); }
  } else if(e.type==='heal'){
    if(target.kind==='hero'){
      const P=s.seats[target.seat]; const before=P.hp;
      P.hp=Math.min(P.maxHp ?? CONFIG.HERO_HP, P.hp+e.value);
      ev.push({type:'heal', target, name:null, amount:P.hp-before, src});
    } else {
      const t=findMinion(s, target.seat, target.id);
      if(t){ const before=t.hp; t.hp=Math.min(t.maxHp, t.hp+e.value);
        ev.push({type:'heal', target, name:t.name, amount:t.hp-before, src}); }
    }
  } else if(e.type==='buff'){
    const t=findMinion(s, target.seat, target.id);
    if(t){ t.atk+=e.value; t.hp+=e.value; t.maxHp+=e.value;
      ev.push({type:'buff', target, name:t.name, value:e.value, src}); }
  }
}

// ---- 검증: 오류 문자열 또는 null(합법) ----
function validate(s, a, actor){
  if(!a || typeof a!=='object') return '잘못된 행동입니다.';
  if(s.over) return '게임이 끝났습니다.';
  if(a.type==='SURRENDER') return null;          // 항복은 어느 시점이든 가능. legalActions 에는 넣지 않는다 (봇은 항복하지 않음)
  if(actor!==s.turn) return '상대 턴입니다.';
  const P=s.seats[actor], O=s.seats[other(actor)];
  switch(a.type){
    case 'END_TURN': return null;
    case 'PLAY_CARD': {
      const c=P.hand.find(x=>x.id===a.cardId);
      if(!c) return '손패에 없는 카드입니다.';
      if(c.cost>P.mana) return '마나가 부족합니다.';
      if(P.board.length>=CONFIG.MAX_BOARD) return '전장이 가득 찼습니다.';
      const ts=cardTargets(s, actor, c);
      if(ts.length===0) return a.target ? '대상이 필요 없는 카드입니다.' : null;
      if(!a.target || !ts.some(t=>tkey(t)===tkey(a.target))) return '올바른 대상을 선택해야 합니다.';
      return null;
    }
    case 'ATTACK': {
      const m=P.board.find(x=>x.id===a.attackerId);
      if(!m) return '내 하수인이 아닙니다.';
      if(m.summoned) return '소환 직후에는 공격할 수 없습니다.';
      if(m.attacked) return '이미 공격했습니다.';
      const t=a.target;
      if(!t || t.seat!==other(actor)) return '공격 대상이 올바르지 않습니다.';
      const taunts=O.board.filter(x=>x.taunt);
      if(t.kind==='hero') return taunts.length ? '도발 하수인을 먼저 공격해야 합니다.' : null;
      if(t.kind==='minion'){
        const d=O.board.find(x=>x.id===t.id);
        if(!d) return '존재하지 않는 대상입니다.';
        if(taunts.length && !d.taunt) return '도발 하수인을 먼저 공격해야 합니다.';
        return null;
      }
      return '공격 대상이 올바르지 않습니다.';
    }
    default: return '알 수 없는 행동입니다.';
  }
}

// ---- 합법 행동 목록 (서버 검증·봇·클라이언트 하이라이트 공통 사용 / AI 학습의 action mask 원천) ----
function legalActions(s, actor){
  if(s.over || s.turn!==actor) return [];
  const P=s.seats[actor], O=s.seats[other(actor)], out=[];
  for(const c of P.hand){
    const ts=cardTargets(s, actor, c);
    for(const t of (ts.length ? ts : [null])){
      const a={type:'PLAY_CARD', cardId:c.id, target:t};
      if(!validate(s,a,actor)) out.push(a);
    }
  }
  const targets=[heroT(other(actor)), ...O.board.map(m=>minionT(other(actor), m.id))];
  for(const m of P.board) for(const t of targets){
    const a={type:'ATTACK', attackerId:m.id, target:t};
    if(!validate(s,a,actor)) out.push(a);
  }
  out.push({type:'END_TURN'});
  return out;
}

// ---- 핵심: 행동 적용. 입력 state 는 수정하지 않고 새 state 를 반환 ----
function apply(state, a, actor){
  const err=validate(state, a, actor);
  if(err) return {ok:false, error:err, state, events:[]};
  const s=structuredClone(state), ev=[], P=s.seats[actor];
  if(a.type==='PLAY_CARD'){
    const c=P.hand.find(x=>x.id===a.cardId);
    P.mana-=c.cost;
    P.hand=P.hand.filter(x=>x.id!==c.id);
    const m={...c, maxHp:c.hp, attacked:false, summoned:true};
    const bf=(P.mods&&P.mods.buff)||0;
    if(bf){ m.hp+=bf; m.maxHp+=bf; }
    P.board.push(m);
    ev.push({type:'summon', seat:actor, id:m.id, name:m.name});
    battlecry(s, actor, m, a.target, ev);
    if(P.mods && P.mods.doubleBattlecry && m.effect){
      const t=a.target, alive = !t || t.kind==='hero' || (findMinion(s, t.seat, t.id)?.hp>0);
      if(alive && (t || m.effect.type==='draw')){ ev.push({type:'echo', seat:actor, name:m.name}); battlecry(s, actor, m, t, ev); }
    }
  } else if(a.type==='ATTACK'){
    const m=P.board.find(x=>x.id===a.attackerId), t=a.target;
    if(t.kind==='hero'){
      ev.push({type:'attack', seat:actor, attackerId:m.id, name:m.name, target:t, targetName:null});
      hurtHero(s, t.seat, m.atk, ev, 'combat');
    } else {
      const d=findMinion(s, t.seat, t.id);
      ev.push({type:'attack', seat:actor, attackerId:m.id, name:m.name, target:t, targetName:d.name});
      const dAtk=d.atk;
      hurtMinion(s, t.seat, d, m.atk, ev, 'combat');
      hurtMinion(s, actor, m, dAtk, ev, 'combat');
    }
    m.attacked=true;
  } else if(a.type==='SURRENDER'){
    s.over=true; s.winner=other(actor);              // 항복 = 즉시 패배 (체력은 건드리지 않음)
    ev.push({type:'surrender', seat:actor});
    ev.push({type:'game_over', winner:s.winner});
  } else if(a.type==='END_TURN'){
    ev.push({type:'turn_end', seat:actor});
    startTurn(s, other(actor), ev);
  }
  sweepDead(s, ev);
  checkEnd(s, ev);
  return {ok:true, state:s, events:ev};
}

// ---- GameView: 특정 좌석에게 보내는 시점 정보 (상대 손패·덱 내용 제외) ----
function viewFor(s, seat){
  const me=s.seats[seat], op=s.seats[other(seat)];
  return structuredClone({
    seat, turn:s.turn, turnNo:s.turnNo, over:s.over, winner:s.winner,
    // deckCards: 내 남은 덱 구성. 뽑는 순서가 드러나지 않도록 id 를 빼고 코스트·이름순으로 정렬해서 보낸다.
    me:{hp:me.hp, maxHp:me.maxHp, mods:me.mods, mana:me.mana, maxMana:me.maxMana, hand:me.hand, board:me.board, deckCount:me.deck.length,
        deckCards:me.deck.map(({id, ...rest})=>rest).sort((a,b)=>a.cost-b.cost || (a.name<b.name?-1:a.name>b.name?1:0))},
    opp:{hp:op.hp, maxHp:op.maxHp, mods:op.mods, mana:op.mana, maxMana:op.maxMana, handCount:op.hand.length, board:op.board, deckCount:op.deck.length},
    legal:legalActions(s, seat)
  });
}

// ---- Player: decide(view) → action. 사람(소켓)·봇이 같은 인터페이스를 따른다 ----
function hpOfTarget(view, t){
  const list = t.seat===view.seat ? view.me.board : view.opp.board;
  const m=list.find(x=>x.id===t.id); return m ? m.hp : Infinity;
}
function pickCardTarget(entries, view){
  const card=view.me.hand.find(c=>c.id===entries[0].cardId), type=card.effect.type;
  const minionOf=t=>(t.seat===view.seat?view.me.board:view.opp.board).find(m=>m.id===t.id);
  let score;
  if(type==='heal')        score=a=>a.target.kind==='hero' ? ((view.me.maxHp||CONFIG.HERO_HP)-view.me.hp) : (minionOf(a.target).maxHp-minionOf(a.target).hp);
  else if(type==='buff')   score=a=>minionOf(a.target).atk;
  else                     score=a=> a.target.seat===view.seat ? -1000                               // 피해: 아군은 피하고
                                   : (a.target.kind==='minion' ? 100-minionOf(a.target).hp : 0);   // 적의 약한 하수인 우선
  return entries.reduce((best,a)=>score(a)>score(best)?a:best);
}
const BotPlayers = {
  // 규칙 기반: 가장 비싼 카드부터 내고, 약한 하수인을 우선 공격, 없으면 영웅 공격
  rule:{ decide(view){
    const L=view.legal;
    const plays=L.filter(a=>a.type==='PLAY_CARD');
    if(plays.length){
      const costOf=a=>view.me.hand.find(c=>c.id===a.cardId).cost;
      const best=Math.max(...plays.map(costOf));
      const cardId=plays.find(a=>costOf(a)===best).cardId;
      const entries=plays.filter(a=>a.cardId===cardId);
      return entries.length===1 ? entries[0] : pickCardTarget(entries, view);
    }
    const atks=L.filter(a=>a.type==='ATTACK');
    if(atks.length){
      const entries=atks.filter(a=>a.attackerId===atks[0].attackerId);
      const mt=entries.filter(a=>a.target.kind==='minion');
      if(mt.length) return mt.reduce((x,y)=>hpOfTarget(view,x.target)<=hpOfTarget(view,y.target)?x:y);
      return entries[0];
    }
    return {type:'END_TURN'};
  }},
  // 무작위: 합법 행동 중 하나 (엔진 시험·부하용)
  random:{ decide(view){ return view.legal[Math.floor(Math.random()*view.legal.length)]; } }
};

// ---- 헤드리스 자동 대전 (엔진 검증 / 전적 데이터 생성용). 콘솔: selfPlay(1000) ----
function selfPlay(games=1000, botA=BotPlayers.rule, botB=BotPlayers.random, maxTurns=200, opts={}){
  const st={games, wins:[0,0], draws:0, stalled:0, errors:0, avgTurns:0}; let turns=0;
  for(let g=0; g<games; g++){
    let s=newGame(Math.random, opts);
    while(!s.over && s.turnNo<=maxTurns){
      const bot = s.turn===0 ? botA : botB;
      const r=apply(s, bot.decide(viewFor(s, s.turn)), s.turn);
      if(!r.ok){ st.errors++; break; }
      s=r.state;
    }
    turns+=s.turnNo;
    if(s.over){ if(s.winner===null) st.draws++; else st.wins[s.winner]++; } else if(st.errors===0 || s.turnNo>maxTurns) st.stalled++;
  }
  st.avgTurns=+(turns/games).toFixed(1);
  return st;
}
</script>

<!-- =====================================================================
     [1.2] 치트 풀 — DOM 없음. 배당 단계에 따라 AI 좌석에 붙일 modifiers 를 추첨한다.
     - 숫자는 전부 여기 한 곳(levels)에만 있다. selfPlay 로 측정해 가며 이 표만 고치면 된다.
     - 같은 group 안에서는 하나만 뽑는다 (같은 자원 축 중첩 방지).
     ===================================================================== -->
<script id="cheats">
const CHEAT_TIERS = {            // 배당% → 치트 개수 / 값 단계(levels 인덱스). 봇 대전 측정: AI 승률 36%(기본) → 47 → 56 → 72 → 86%
  150:{count:0, level:-1},
  200:{count:1, level:0},
  300:{count:2, level:0},        // 먼저 개수를 늘리고
  400:{count:2, level:1},        // 그다음 값을 키운다
  500:{count:2, level:3},
};
const CHEATS = [   // 값은 봇 대전(measure)으로 잰 잠정치. 사람 승률은 따로 보정 필요.
  {id:'hp',              name:'강인한 영웅',   minTier:200, levels:[20,30,45,60], desc:v=>`영웅 체력 +${v}`},
  {id:'startMana',       name:'앞선 출발',     minTier:200, levels:[2,3,4,5],     desc:v=>`첫 턴부터 마나 ${v}`,          group:'economy'},
  {id:'manaBonus',       name:'마력의 샘',     minTier:200, levels:[1,1,2,3],     desc:v=>`매 턴 마나 +${v}`,             group:'economy'},
  {id:'costDown',        name:'값싼 병력',     minTier:200, levels:[1,1,2,2],     desc:v=>`덱의 하수인 비용 −${v}`,        group:'economy'},
  {id:'startHand',       name:'풍부한 손패',   minTier:200, levels:[1,2,2,3],     desc:v=>`시작 손패 +${v}장 (최대 ${CONFIG.START_HAND_MAX}장)`, group:'draw'},
  {id:'extraDraw',       name:'속독',          minTier:300, levels:[2],           desc:v=>`첫 ${v}턴 동안 매 턴 카드 2장 뽑기`, group:'draw'},   // 켜짐/꺼짐형. 값은 지속 턴 수
  {id:'startBoard',      name:'선발대',        minTier:200, levels:[1,2,3,4],     desc:v=>`시작 필드에 보초병(1/2) ${v}기`},
  {id:'buff',            name:'튼튼한 병력',   minTier:400, levels:[1],           desc:v=>`소환되는 하수인 체력 +${v}`},
  {id:'armor',           name:'강철 피부',     minTier:200, levels:[1,2,3,4],     desc:v=>`영웅이 받는 피해 −${v}`},
  {id:'doubleBattlecry', name:'메아리',        minTier:400, levels:[true],        desc:()=>'전투의 함성이 두 번 발동'},
];
const cheatValue = (c, level) => c.levels[Math.min(Math.max(level,0), c.levels.length-1)];
function cheatCandidates(tier){
  const t=CHEAT_TIERS[tier]; if(!t || t.count<=0) return [];
  return CHEATS.filter(c=>c.minTier<=tier).map(c=>{ const v=cheatValue(c, t.level); return {id:c.id, name:c.name, value:v, desc:c.desc(v), group:c.group||null}; });
}
// → {mods:{...}, list:[{id,name,desc}]}
function rollCheats(tier, rng=Math.random){
  const t=CHEAT_TIERS[tier], out={mods:{}, list:[]};
  if(!t || t.count<=0) return out;
  const pool=cheatCandidates(tier);
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  const usedGroups=new Set();
  for(const c of pool){
    if(out.list.length>=t.count) break;
    if(c.group && usedGroups.has(c.group)) continue;
    if(c.group) usedGroups.add(c.group);
    out.mods[c.id]=c.value; out.list.push({id:c.id, name:c.name, desc:c.desc});
  }
  return out;
}
</script>

<!-- =====================================================================
     [1.5] 경제(골드) — DOM 없음. 룰 엔진과 별개로 "게임이 끝난 뒤" 보상만 처리한다.
     - 순수 함수: settle(save, ctx) → {save, summary}   (입력 save 는 수정하지 않음)
     - 저장소: localStorage (막혀 있으면 메모리로 대체). 나중에 서버 API 로 교체할 때 Store 만 바꾼다.
     ===================================================================== -->
<script id="economy">
const ECON = {
  SAVE_KEY:'cardDuel.save', VERSION:1,
  START_GOLD:100,
  EASY_WIN:10,                       // 초급: 승리 시 고정 보상
  POOL_START:100, POOL_MIN:20, POOL_MAX:300,
  POOL_UP:1.05, POOL_DOWN:0.95,      // 중급 일반: 승리 ×1.05 / 패배 ×0.95
  RESET_HOUR:5,                      // 새벽 5시 기준으로 하루가 바뀐다
  BET_MAX_RATIO:1.0,                 // 배팅 최대 = 보유 골드의 100% (전액 배팅 가능). 한도를 다시 두려면 0.5 등으로
  BET_TIERS:[150,200,300,400,500],   // 선택 가능한 배당(%): 승리 시 순이익 = 건 금액 × 배당%
  BET_DEFAULT:150,
};
const Economy = (() => {
  const pad = n => String(n).padStart(2,'0');
  function dayKey(now=new Date()){
    const d=new Date(now.getTime() - ECON.RESET_HOUR*3600*1000);
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }
  const clampPool = x => Math.min(ECON.POOL_MAX, Math.max(ECON.POOL_MIN, x));
  const fresh = (now) => ({v:ECON.VERSION, gold:ECON.START_GOLD, pool:ECON.POOL_START, poolDay:dayKey(now), bet:0});

  // 날짜가 바뀌었으면 풀 초기화
  function refresh(save, now=new Date()){
    const k=dayKey(now);
    return save.poolDay===k ? save : {...save, pool:ECON.POOL_START, poolDay:k};
  }
  function sanitize(raw, now){
    const base=fresh(now);
    if(!raw || typeof raw!=='object') return base;
    const num=(x,d)=>Number.isFinite(x)?x:d;
    return {v:ECON.VERSION,
      gold:Math.max(0, Math.floor(num(raw.gold, base.gold))),
      pool:clampPool(num(raw.pool, base.pool)),
      poolDay:typeof raw.poolDay==='string'?raw.poolDay:base.poolDay,
      bet:Math.max(0, Math.floor(num(raw.bet, 0)))};
  }
  const poolNow = save => Math.round(clampPool(save.pool));
  function maxBet(save){
    if(save.gold<1) return 0;
    return Math.max(1, Math.floor(save.gold*ECON.BET_MAX_RATIO));
  }
  const betWinNet = (amount, pct=ECON.BET_DEFAULT) => Math.round(amount*pct/100);   // 승리 시 순이익

  // 배팅 시작: 즉시 차감. 잘못된 금액이면 null.
  function placeBet(save, amount){
    if(!Number.isInteger(amount) || amount<1 || amount>maxBet(save)) return null;
    return {...save, gold:save.gold-amount, bet:amount};
  }
  // ctx: {difficulty:'easy'|'normal', mode:'normal'|'bet', bet:number, payoutPct:number, pool:number, winner:0|1|null}  (winner 0 = 나)
  function settle(save, ctx){
    const win = ctx.winner===0, draw = ctx.winner===null;
    let next={...save}, payout=0, net=0, poolFrom=Math.round(save.pool), poolTo=poolFrom, kind='none';
    if(ctx.difficulty==='easy'){
      kind='easy'; if(win){ payout=ECON.EASY_WIN; net=payout; }
    } else if(ctx.mode==='bet'){
      kind='bet'; const bet=ctx.bet||0;
      if(win){ payout=bet+betWinNet(bet, ctx.payoutPct); net=payout-bet; }
      else if(draw){ payout=bet; net=0; }            // 무승부는 환불
      else { payout=0; net=-bet; }
      next.bet=0;                                      // 풀은 건드리지 않는다
    } else {
      kind='normal';
      if(win){ payout=Math.round(clampPool(ctx.pool)); net=payout; next.pool=clampPool(save.pool*ECON.POOL_UP); }
      else if(!draw){ next.pool=clampPool(save.pool*ECON.POOL_DOWN); }
      poolTo=Math.round(next.pool);
    }
    next.gold=save.gold+payout;
    return {save:next, summary:{kind, win, draw, payout, net, poolFrom, poolTo, bet:ctx.bet||0, payoutPct:ctx.payoutPct||ECON.BET_DEFAULT}};
  }

  // ---- 저장소 ----
  let memory=null;
  const Store = {
    read(){ try{ const t=localStorage.getItem(ECON.SAVE_KEY); return t?JSON.parse(t):memory; }catch(e){ return memory; } },
    write(save){ memory=save; try{ localStorage.setItem(ECON.SAVE_KEY, JSON.stringify(save)); }catch(e){} },
  };
  let cur=null, forfeited=0;
  function load(now=new Date()){
    const raw=Store.read();
    let sv=refresh(sanitize(raw, now), now);
    if(sv.bet>0){ forfeited=sv.bet; sv={...sv, bet:0}; }   // 게임 도중 종료된 배팅은 잃은 것으로 처리
    cur=sv; Store.write(cur); return cur;
  }
  const get = () => { cur=refresh(cur||load()); return cur; };
  const set = sv => { cur=sv; Store.write(cur); return cur; };
  const takeForfeited = () => { const f=forfeited; forfeited=0; return f; };
  return {dayKey, refresh, sanitize, poolNow, maxBet, betWinNet, placeBet, settle, load, get, set, takeForfeited};
})();
</script>

<!-- =====================================================================
     [2] 로컬 호스트 + 화면
     - Host 가 지금은 같은 브라우저 안의 "가짜 서버". 나중에 이 객체만 WebSocket 으로 교체:
         submit(seat, action) → ws.send(행동 메시지) / 응답(STATE_SYNC: view + events) 수신
     - 화면은 view 만 읽어 그리고, 클릭은 행동 객체로 바꿔 submit 한다. 룰 판정은 하지 않는다.
     - 연출은 events 를 순서대로 재생한다 (판정은 이미 끝난 상태).
     ===================================================================== -->
<script id="ui">
const MY=0, OPP=1;
const Host = {
  state:null,
  start(mods){ this.state=newGame(Math.random, {mods:[{}, mods||{}]}); },   // AI(좌석 1)에게만 치트 적용
  view(seat){ return viewFor(this.state, seat); },
  submit(seat, action){
    const r=apply(this.state, action, seat);
    if(r.ok) this.state=r.state;
    return {ok:r.ok, error:r.error, events:r.events};
  }
};
// 난이도 → 상대 Player. bot:null 이면 아직 구현 전이라 선택할 수 없다.
const DIFFICULTY = {
  easy:   {label:'초급', desc:'완전 무작위로 행동하는 AI',      bot:BotPlayers.random},
  normal: {label:'중급', desc:'규칙 기반으로 행동하는 AI',      bot:BotPlayers.rule},
  hard:   {label:'상급', desc:'강화학습 기반 AI',               bot:null},   // TODO: 학습한 정책(BotPlayer)이 준비되면 연결
};
let Bot = null;                    // 상대 좌석을 움직이는 Player (나중에 원격 사람으로 교체)
let game = null;                   // {key, mode, bet, tier, cheats, pool, settled, result} 현재 판의 보상 정보
let betTier = ECON.BET_DEFAULT;    // 배팅 화면에서 고른 배당(%)
const fmt = n => Number(n).toLocaleString('ko-KR');

let view=null;
const ui={selected:null, pending:null, busy:false};
const sleep = ms => new Promise(r=>setTimeout(r, ms));
const $ = id => document.getElementById(id);

// ---------- 로그 / 이벤트 문장 ----------
function logLine(msg){
  const list=$('logList'), item=document.createElement('div');
  item.textContent=msg; list.appendChild(item);
  while(list.children.length>60) list.removeChild(list.firstChild);
}
const who = seat => seat===MY ? '내' : '상대';
const heroLabel = seat => seat===MY ? '내 영웅' : '상대 영웅';
const tLabel = (t,name) => t.kind==='hero' ? heroLabel(t.seat) : name;
function eventText(ev){
  switch(ev.type){
    case 'turn_start': return ev.seat===MY ? '당신의 턴입니다.' : '상대의 턴입니다.';
    case 'draw':
      if(ev.src) return `${who(ev.src.seat)} ${ev.src.name}: 카드 ${ev.count+ev.burned}장 뽑기`;
      return ev.burned ? `${who(ev.seat)} 손패가 가득 차 카드 ${ev.burned}장이 소멸했습니다.` : null;
    case 'summon': return ev.seat===MY ? `${ev.name} 소환!` : `상대가 ${ev.name}을(를) 소환!`;
    case 'attack': return `${who(ev.seat)} ${ev.name} → ${ev.targetName || heroLabel(ev.target.seat)} 공격!`;
    case 'damage':
      if(ev.absorbed) return `${ev.name}의 보호막이 파괴됐습니다!`;
      if(ev.cause==='battlecry') return `${who(ev.src.seat)} ${ev.src.name}: ${tLabel(ev.target,ev.name)}에게 ${ev.amount} 피해`;
      return ev.target.kind==='hero' ? `${heroLabel(ev.target.seat)}에게 ${ev.amount} 피해` : null;
    case 'heal': return `${who(ev.src.seat)} ${ev.src.name}: ${tLabel(ev.target,ev.name)} 체력 ${ev.amount} 회복`;
    case 'buff': return `${who(ev.src.seat)} ${ev.src.name}: ${ev.name} +${ev.value}/+${ev.value}`;
    case 'ignored': return `${who(ev.seat)} ${ev.src.name}: 대상이 없어 효과 무시`;
    case 'echo': return `${who(ev.seat)} ${ev.name}: 전투의 함성이 한 번 더 발동!`;
    case 'surrender': return `${who(ev.seat)} 항복했습니다.`;
    case 'death': return `${who(ev.seat)} ${ev.name} 파괴됨`;
    case 'game_over': return ev.winner===null ? '무승부' : (ev.winner===MY ? '승리!' : '패배...');
    default: return null;
  }
}

// ---------- 연출 ----------
const zoneEl = seat => $(seat===MY ? 'playerZone' : 'aiZone');
const heroEl = seat => $(seat===MY ? 'playerHero' : 'aiHero');
function elOf(t){
  if(t.kind==='hero') return heroEl(t.seat);
  return zoneEl(t.seat).querySelector(`.card[data-id="${t.id}"]`);
}
function floatOn(t, text, cls){
  const el=elOf(t); if(!el) return;
  const r=el.getBoundingClientRect(), f=document.createElement('div');
  f.className='float '+cls; f.textContent=text;
  f.style.left=(r.left+r.width/2)+'px'; f.style.top=(r.top+r.height/2)+'px';
  document.body.appendChild(f); setTimeout(()=>f.remove(), 950);
}
function showEffect(ev){
  if(ev.type==='damage'){
    if(ev.absorbed) floatOn(ev.target,'🛡','shield'); else floatOn(ev.target,'-'+ev.amount,'dmg');
  } else if(ev.type==='heal'){ floatOn(ev.target,'+'+ev.amount,'heal'); }
  else if(ev.type==='buff'){ floatOn(ev.target,`+${ev.value}/+${ev.value}`,'buff'); }
  else if(ev.type==='death'){ const el=elOf(minionT(ev.seat, ev.id)); if(el) el.classList.add('dead'); }
}
async function lungeApproach(ev){
  const a=elOf(minionT(ev.seat, ev.attackerId)), t=elOf(ev.target);
  if(!a||!t) return;
  const r1=a.getBoundingClientRect(), r2=t.getBoundingClientRect();
  const dx=(r2.left+r2.width/2)-(r1.left+r1.width/2), dy=(r2.top+r2.height/2)-(r1.top+r1.height/2);
  a.setAttribute('data-attacking','1');
  a.style.transition='transform .15s ease-in';
  a.style.transform=`translate(${dx*0.7}px,${dy*0.7}px) scale(1.08)`;
  await sleep(160);
}
async function lungeRetract(ev){
  const a=elOf(minionT(ev.seat, ev.attackerId)); if(!a) return;
  a.style.transition='transform .15s ease-out';
  a.style.transform='translate(0,0) scale(1)';
  await sleep(160);
}
// 현재 DOM 은 "행동 직전" 상태. 이벤트를 연출한 뒤 호출자가 최종 상태로 render 한다.
async function playEvents(evs){
  for(let i=0;i<evs.length;i++){
    const ev=evs[i];
    if(ev.type==='attack'){
      const group=[];
      while(i+1<evs.length && (evs[i+1].type==='damage'||evs[i+1].type==='death')) group.push(evs[++i]);
      logLine(eventText(ev));
      await lungeApproach(ev);
      for(const g of group){ const t=eventText(g); if(t) logLine(t); showEffect(g); }
      await sleep(240);
      await lungeRetract(ev);
      continue;
    }
    const t=eventText(ev); if(t) logLine(t);
    showEffect(ev);
    await sleep(ev.type==='summon'?250 : (ev.type==='damage'||ev.type==='heal'||ev.type==='buff'||ev.type==='death')?320 : 80);
  }
}

// ---------- 행동 실행 ----------
async function perform(seat, action){
  const r=Host.submit(seat, action);
  if(!r.ok) return r;
  await playEvents(r.events);
  view=Host.view(MY);
  render();
  return r;
}
async function playerAction(action){
  if(ui.busy) return;
  ui.busy=true; ui.selected=null; ui.pending=null; stopArrow();
  const r=await perform(MY, action);
  if(!r.ok){ logLine('⚠ '+r.error); ui.busy=false; render(); return; }
  if(!Host.state.over && Host.state.turn===OPP) await runOpponentTurn();
  if(Host.state.over) finishGame();
  ui.busy=false; render();
}
// 게임 종료 시 정확히 한 번만 정산
function finishGame(){
  if(!game || game.settled) return;
  game.settled=true;
  const winner=Host.state.winner;
  const r=Economy.settle(Economy.get(), {difficulty:game.key, mode:game.mode, bet:game.bet, payoutPct:game.tier, pool:game.pool, winner});
  Economy.set(r.save);
  game.result=r.summary;
  updateWallet();
  const m=r.summary;
  if(m.kind==='easy') logLine(m.win?`보상 +${m.payout}골드`:'보상 없음');
  else if(m.kind==='bet') logLine(m.win?`배팅 성공! (${m.payoutPct}%) +${fmt(m.net)}골드`:m.draw?'무승부: 배팅 금액 환불':`배팅 실패... -${fmt(m.bet)}골드`);
  else logLine(m.win?`보상 +${fmt(m.payout)}골드 (풀 ${m.poolFrom}→${m.poolTo})`:m.draw?'무승부: 변동 없음':`풀 ${m.poolFrom}→${m.poolTo}`);
}
function rewardHTML(){
  const m=game && game.result; if(!m) return '';
  const sign=n=>n>0?`<span class="plus">+${fmt(n)}골드</span>`:n<0?`<span class="minus">${fmt(n)}골드</span>`:'<span>±0골드</span>';
  let top, sub='';
  if(m.kind==='easy') top=m.win?sign(m.payout):'<span>획득 골드 없음</span>';
  else if(m.kind==='bet'){ top=sign(m.net); sub=m.win?`배팅 ${fmt(m.bet)}골드 × 배당 ${m.payoutPct}% → ${fmt(m.payout)}골드 반환`:m.draw?'무승부로 배팅 금액이 환불되었습니다':`배팅 ${fmt(m.bet)}골드를 잃었습니다`; }
  else { top=m.win?sign(m.payout):'<span>획득 골드 없음</span>'; sub=m.draw?'':`오늘의 보상 풀 ${m.poolFrom} → ${m.poolTo}`; }
  return `${top}<span class="sub2">${sub}</span><span class="sub2">보유 골드 ${fmt(Economy.get().gold)}</span>`;
}
async function runOpponentTurn(){
  while(!Host.state.over && Host.state.turn===OPP){
    await sleep(450);
    let act=Bot.decide(Host.view(OPP));
    let r=await perform(OPP, act);
    if(!r.ok){ console.error('봇이 불법 행동 시도:', act, r.error); act={type:'END_TURN'}; r=await perform(OPP, act); }
    if(act.type==='END_TURN') break;
  }
}

// ---------- 입력 → 행동 ----------
function playCard(c){
  if(ui.busy || view.turn!==MY || view.over) return;
  const entries=view.legal.filter(a=>a.type==='PLAY_CARD' && a.cardId===c.id);
  if(!entries.length){
    logLine(c.cost>view.me.mana ? '마나가 부족합니다.' : view.me.board.length>=CONFIG.MAX_BOARD ? '전장이 가득 찼습니다.' : '지금은 낼 수 없는 카드입니다.');
    return;
  }
  ui.selected=null; stopArrow();
  if(entries.length===1){ playerAction(entries[0]); return; }
  ui.pending={cardId:c.id, entries};
  logLine('대상을 선택하세요.');
  render();
}
function isPendingTarget(t){ return !!ui.pending && ui.pending.entries.some(a=>tkey(a.target)===tkey(t)); }
function resolvePending(t){
  if(!isPendingTarget(t)) return;
  playerAction(ui.pending.entries.find(a=>tkey(a.target)===tkey(t)));
}
function cancelPending(){ ui.pending=null; render(); }
document.addEventListener('click', e=>{
  if(!ui.pending) return;
  if(e.target.closest && (e.target.closest('.card')||e.target.closest('.hero'))) return;
  ui.pending=null; render();
}, true);

function selectMinion(m, canAttack){
  if(ui.busy || !canAttack) return;
  if(ui.selected===m.id){ ui.selected=null; stopArrow(); render(); return; }
  ui.selected=m.id; render();
  const el=zoneEl(MY).querySelector(`.card[data-id="${m.id}"]`);
  if(el) startArrow(el);
}
function attackTarget(t){
  if(ui.busy || ui.selected===null) return;
  const a=view.legal.find(x=>x.type==='ATTACK' && x.attackerId===ui.selected && tkey(x.target)===tkey(t));
  if(!a){ logLine(view.opp.board.some(m=>m.taunt) ? '상대 도발 하수인을 먼저 공격해야 합니다.' : '공격할 수 없습니다.'); return; }
  playerAction(a);
}
$('endTurnBtn').onclick=()=>{ if(!ui.busy && view.turn===MY && !view.over && !ui.pending) playerAction({type:'END_TURN'}); };

// 항복: 실수 방지를 위해 두 번 눌러야 한다 (첫 클릭 → 3초간 "정말 항복?" → 한 번 더 누르면 항복)
let surrenderTimer=null;
function resetSurrenderBtn(){
  clearTimeout(surrenderTimer); surrenderTimer=null;
  const b=$('surrenderBtn'); b.textContent='항복'; b.classList.remove('armed');
}
$('surrenderBtn').onclick=()=>{
  if(ui.busy || !view || view.over) return;
  if(!surrenderTimer){
    const b=$('surrenderBtn');
    b.textContent = game && game.mode==='bet' ? `정말 항복? (−${fmt(game.bet)}G)` : '정말 항복?';
    b.classList.add('armed');
    surrenderTimer=setTimeout(resetSurrenderBtn, 3000);
    return;
  }
  resetSurrenderBtn();
  playerAction({type:'SURRENDER'});
};

// ---------- 조준 화살표 ----------
function outsideCancel(e){
  if(e.target.closest && (e.target.closest('.card')||e.target.closest('#aiHero'))) return;
  ui.selected=null; stopArrow(); render();
}
function startArrow(attackerEl){
  $('arrowSvg').style.display='block';
  document.addEventListener('mousemove', onArrowMove);
  document.addEventListener('touchmove', onArrowTouchMove, {passive:false});
  document.addEventListener('click', outsideCancel, true);
  const r=attackerEl.getBoundingClientRect();
  drawArrow(r.left+r.width/2, r.top, r.left+r.width/2, r.top);
}
function stopArrow(){
  $('arrowSvg').style.display='none';
  document.removeEventListener('mousemove', onArrowMove);
  document.removeEventListener('touchmove', onArrowTouchMove);
  document.removeEventListener('click', outsideCancel, true);
}
function onArrowMove(e){ moveArrowTip(e.clientX, e.clientY); }
function onArrowTouchMove(e){ if(e.touches[0]){ moveArrowTip(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); } }
function moveArrowTip(x,y){
  if(ui.selected===null) return;
  const el=zoneEl(MY).querySelector(`.card[data-id="${ui.selected}"]`); if(!el) return;
  const r=el.getBoundingClientRect();
  drawArrow(r.left+r.width/2, r.top, x, y);
}
function drawArrow(x1,y1,x2,y2){
  const line=$('arrowLine');
  line.setAttribute('x1',x1); line.setAttribute('y1',y1); line.setAttribute('x2',x2); line.setAttribute('y2',y2);
}

// ---------- 렌더 (view 만 읽는다) ----------
function cardEl(c, opts={}){
  const el=document.createElement('div');
  el.className='card'+(opts.extra?(' '+opts.extra):'');
  el.dataset.id=c.id;
  let tags='';
  if(c.taunt) tags+='<span class="tag taunt">도발</span>';
  if(c.shield) tags+='<span class="tag shield">보호막</span>';
  const eff=effectText(c);
  el.innerHTML=`<div class="cost">${c.cost}</div><div class="cname">${c.name}</div><div class="effect">${tags}${tags&&eff?'<br>':''}${eff}</div><div class="stats"><span class="atk">${c.atk}</span><span class="life">${c.hp}</span></div>`;
  if(opts.onClick) el.onclick=opts.onClick;
  return el;
}

// 마나 표시 (내 쪽·상대 쪽 공통). '매 턴 마나 +N' 치트가 있으면 그 추가분까지 총량에 포함한다.
function renderMana(textId, crystalsId, p){
  const total=Math.max(1, p.maxMana+((p.mods&&p.mods.manaBonus)||0));
  $(textId).textContent=`마나 ${p.mana} / ${total}`;
  const cz=$(crystalsId); cz.innerHTML='';
  for(let i=0;i<total;i++){
    const d=document.createElement('div'); d.className='crystal'+(i<p.mana?'':' empty'); cz.appendChild(d);
  }
}
function renderOppHand(n){
  const box=$('aiHand'); box.innerHTML='';
  for(let i=0;i<n;i++){ const b=document.createElement('div'); b.className='card-back'; box.appendChild(b); }   // 내용은 알 수 없으므로 뒷면만
}
function renderCheats(){
  const box=$('aiCheats'); box.innerHTML='';
  ((game&&game.cheats)||[]).forEach(c=>{ const el=document.createElement('span'); el.className='chip'; el.textContent=c.desc; el.title=c.name; box.appendChild(el); });
}
function render(){
  const v=view, me=v.me, op=v.opp;
  renderCheats();
  renderOppHand(op.handCount);
  $('playerHp').textContent=Math.max(0, me.hp);
  $('aiHp').textContent=Math.max(0, op.hp);
  renderMana('manaText','crystals',me);
  renderMana('aiManaText','aiCrystals',op);
  $('aiHandCnt').textContent=op.handCount; $('aiDeckCnt').textContent=op.deckCount; $('myDeckCnt').textContent=me.deckCount;

  const active = v.turn===MY && !v.over && !ui.busy;
  const legal = active ? v.legal : [];
  const pending = ui.pending;

  const hand=$('hand'); hand.innerHTML='';
  me.hand.forEach(c=>{
    const isPending = !!pending && pending.cardId===c.id;
    const playable = legal.some(a=>a.type==='PLAY_CARD' && a.cardId===c.id) && (!pending || isPending);
    const extra=(playable?'':'unaffordable')+(isPending?' selected':'');
    hand.appendChild(cardEl(c, {extra, onClick:()=> isPending ? cancelPending() : playCard(c)}));
  });

  const pz=zoneEl(MY); pz.innerHTML='';
  me.board.forEach(m=>{
    const canAttack = !pending && legal.some(a=>a.type==='ATTACK' && a.attackerId===m.id);
    const t=minionT(MY, m.id), isTarget=isPendingTarget(t);
    const extra=(ui.selected===m.id?'selected':'')+(canAttack?' attackable':'')+(m.summoned?' sick':'')+(isTarget?' targetable':'')+(m.taunt?' taunt':'')+(m.shield?' shielded':'');
    pz.appendChild(cardEl(m, {extra, onClick: pending ? ()=>resolvePending(t) : ()=>selectMinion(m, canAttack)}));
  });

  const az=zoneEl(OPP); az.innerHTML='';
  op.board.forEach(m=>{
    const t=minionT(OPP, m.id);
    const isTarget=isPendingTarget(t) || (ui.selected!==null && legal.some(a=>a.type==='ATTACK' && a.attackerId===ui.selected && tkey(a.target)===tkey(t)));
    const extra=(m.summoned?'sick':'')+(isTarget?' targetable':'')+(m.taunt?' taunt':'')+(m.shield?' shielded':'');
    az.appendChild(cardEl(m, {extra, onClick: pending ? ()=>resolvePending(t) : ()=>attackTarget(t)}));
  });

  $('endTurnBtn').disabled = !active || !!pending;
  $('surrenderBtn').disabled = v.over || ui.busy;
  if(v.over || ui.busy) resetSurrenderBtn();

  const myHeroT=heroT(MY), opHeroT=heroT(OPP);
  const myHeroTarget=isPendingTarget(myHeroT);
  const opHeroTarget=isPendingTarget(opHeroT) || (ui.selected!==null && legal.some(a=>a.type==='ATTACK' && a.attackerId===ui.selected && tkey(a.target)===tkey(opHeroT)));
  $('playerHero').classList.toggle('targetable', myHeroTarget);
  $('aiHero').classList.toggle('targetable', opHeroTarget);
  $('playerHero').onclick = myHeroTarget ? ()=>resolvePending(myHeroT) : null;
  $('aiHero').onclick = pending ? (opHeroTarget ? ()=>resolvePending(opHeroT) : null) : ()=>attackTarget(opHeroT);

  if(v.over){
    $('overlay').classList.add('show');
    $('overlayText').textContent = v.winner===null ? '무승부' : (v.winner===MY ? '승리했습니다!' : '패배했습니다...');
    $('overlayReward').innerHTML = rewardHTML();
  }
  if($('deckModal').classList.contains('show')) renderDeckModal();
}

// ---------- 내 덱 보기 ----------
function renderDeckModal(){
  if(!view) return;
  const rem={};
  for(const c of view.me.deckCards) rem[c.name]=(rem[c.name]||0)+1;
  const total=CARD_POOL.length*CONFIG.COPIES;
  $('deckTitle').textContent=`내 덱 — 남은 카드 ${view.me.deckCount}장 / 전체 ${total}장`;
  const grid=$('deckGrid'); grid.innerHTML='';
  CARD_POOL.forEach(c=>{
    const n=rem[c.name]||0;
    const el=cardEl(c, {extra:n?'':'drawn'});
    const badge=document.createElement('div');
    badge.className='copies'; badge.textContent=`${n}/${CONFIG.COPIES}`;
    el.appendChild(badge);
    grid.appendChild(el);
  });
}
function openDeck(){ if(!view) return; renderDeckModal(); $('deckModal').classList.add('show'); }
function closeDeck(){ $('deckModal').classList.remove('show'); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDeck(); });

// ---------- 메뉴 / 게임 시작·종료 ----------
function showScreen(name){
  document.querySelectorAll('#menu .screen').forEach(el=>el.classList.toggle('show', el.id==='screen-'+name));
}
function updateWallet(){
  const g=fmt(Economy.get().gold);
  document.querySelectorAll('.walletView').forEach(el=>el.textContent=`💰 ${g}`);
}
function rewardDesc(key){
  if(key==='easy') return `승리 시 ${ECON.EASY_WIN}골드 · 패배 시 0골드`;
  if(key==='normal') return '일반 / 배팅 모드 선택 가능';
  return '';
}
function buildDifficultyButtons(){
  const box=$('difficultyList'); box.innerHTML='';
  for(const [key,d] of Object.entries(DIFFICULTY)){
    const b=document.createElement('button');
    b.className='menu-btn';
    const rd=d.bot?rewardDesc(key):'';
    b.innerHTML=`${d.label}${d.bot?'':'<span class="soon">준비 중</span>'}<span class="desc">${d.desc}</span>${rd?`<span class="desc">💰 ${rd}</span>`:''}`;
    b.disabled=!d.bot;
    b.onclick=()=> key==='normal' ? openPlayMode() : startGame(key,{mode:'normal'});
    box.appendChild(b);
  }
}
// ---- 중급: 일반 / 배팅 선택 ----
function openPlayMode(){
  const sv=Economy.get(), pool=Economy.poolNow(sv);
  $('btnNormalMode').innerHTML=`일반 모드<span class="desc">참가비 없음 · 승리 시 오늘의 보상 <b>${pool}골드</b></span><span class="desc">승리하면 보상 +5%, 패배하면 −5% (매일 새벽 ${ECON.RESET_HOUR}시 ${ECON.POOL_START}골드로 초기화)</span>`;
  const mb=Economy.maxBet(sv);
  $('btnBetMode').disabled = mb<1;
  $('btnBetMode').innerHTML=`배팅 모드${mb<1?'<span class="soon">골드 부족</span>':''}<span class="desc">골드를 걸고 대전 · 배당 ${ECON.BET_TIERS[0]}~${ECON.BET_TIERS[ECON.BET_TIERS.length-1]}% 선택, 패배 시 건 골드를 모두 잃음</span><span class="desc">배당 200% 이상은 상대 AI가 치트를 받습니다 · 보상 풀과는 별개 (최대 ${fmt(mb)}골드)</span>`;
  showScreen('playmode');
}
// ---- 배팅 화면 ----
function betBounds(){ const sv=Economy.get(); return {gold:sv.gold, min:1, max:Economy.maxBet(sv)}; }
function readBet(){
  const {min,max}=betBounds();
  let v=Math.floor(Number($('betInput').value));
  if(!Number.isFinite(v)) v=min;
  return Math.min(max, Math.max(min, v));
}
function refreshBetUI(){
  const {gold,min,max}=betBounds(), v=readBet();
  $('betGold').textContent=fmt(gold)+'골드';
  $('betMax').textContent=fmt(max)+'골드';
  $('betRange').min=min; $('betRange').max=max; $('betRange').value=v;
  $('betInput').min=min; $('betInput').max=max;
  const net=Economy.betWinNet(v, betTier);
  $('betResult').innerHTML=`승리 시 <span class="win">+${fmt(net)}</span> (총 ${fmt(v+net)}골드 반환) · 패배 시 <span class="lose">−${fmt(v)}</span>`;
  buildTierToggle(); renderCheatInfo();
  $('betGo').disabled = max<1;
}
function buildTierToggle(){
  const box=$('tierToggle'); box.innerHTML='';
  ECON.BET_TIERS.forEach(t=>{
    const b=document.createElement('button'); b.textContent=t+'%'; b.className=t===betTier?'on':'';
    b.onclick=()=>{ betTier=t; refreshBetUI(); };
    box.appendChild(b);
  });
  $('betTierLabel').textContent=`${betTier}%`;
}
function renderCheatInfo(){
  const box=$('cheatInfo'), t=CHEAT_TIERS[betTier], cands=cheatCandidates(betTier);
  if(!t || t.count<=0){ box.textContent='치트 없음 — 기본 AI와 대전합니다.'; return; }
  box.innerHTML=`상대 AI가 치트 <b>${t.count}개</b>를 받습니다 (게임 시작 때 아래 후보에서 무작위 추첨)<br>`+cands.map(c=>`<span class="chip">${c.desc}</span>`).join('');
}
function setBet(x){
  const {min,max}=betBounds();
  $('betInput').value = x==='min'?min : x==='max'?max : Math.max(min, Math.min(max, Math.floor(max*x)));
  refreshBetUI();
}
function openBetScreen(){
  betTier=ECON.BET_DEFAULT;
  const {min,max}=betBounds();
  $('betInput').value=Math.min(max, Math.max(min, Math.floor(max/2)||min));
  refreshBetUI(); showScreen('bet');
}
$('betInput').addEventListener('input', refreshBetUI);
$('betInput').addEventListener('change', ()=>{ $('betInput').value=readBet(); refreshBetUI(); });
$('betRange').addEventListener('input', ()=>{ $('betInput').value=$('betRange').value; refreshBetUI(); });
function confirmBet(){
  const amount=readBet();
  const placed=Economy.placeBet(Economy.get(), amount);
  if(!placed){ refreshBetUI(); return; }
  Economy.set(placed);                         // 시작 시점에 차감하고 즉시 저장
  startGame('normal', {mode:'bet', bet:amount, tier:betTier});
}

function startGame(key, opts={}){
  const d=DIFFICULTY[key];
  if(!d || !d.bot) return;
  const mode=opts.mode||'normal', sv=Economy.get();
  const tier = mode==='bet' ? (opts.tier||ECON.BET_DEFAULT) : 0;
  const roll = mode==='bet' ? rollCheats(tier) : {mods:{}, list:[]};
  game={key, mode, bet:mode==='bet'?(opts.bet||0):0, tier, cheats:roll.list, pool:Economy.poolNow(sv), settled:false, result:null};
  Bot=d.bot;
  Host.start(roll.mods);
  view=Host.view(MY);
  ui.selected=null; ui.pending=null; ui.busy=false; stopArrow(); closeDeck(); resetSurrenderBtn();
  $('logList').innerHTML='';
  $('overlay').classList.remove('show');
  $('overlayReward').innerHTML='';
  const tag = key==='easy' ? `승리 +${ECON.EASY_WIN}G` : mode==='bet' ? `배팅 ${fmt(game.bet)}G · ${tier}%` : `보상 ${game.pool}G`;
  $('diffBadge').textContent=`${d.label} · ${tag}`;
  $('menu').classList.add('hidden');
  updateWallet();
  logLine(`게임 시작! (${d.label} 상대${mode==='bet'?` · 배팅 ${fmt(game.bet)}골드`:''}) 당신의 턴입니다.`);
  if(game.cheats.length) logLine('⚠ 상대 치트: '+game.cheats.map(c=>c.desc).join(' / '));
  render();
}
function goToMenu(){
  $('overlay').classList.remove('show');
  ui.selected=null; ui.pending=null; ui.busy=false; stopArrow(); closeDeck();
  buildDifficultyButtons(); updateWallet();
  showScreen('main');
  $('menu').classList.remove('hidden');
}

// ---------- 시작: 메뉴 화면부터 ----------
Economy.load();
buildDifficultyButtons();
updateWallet();
{ const f=Economy.takeForfeited();
  if(f>0){ const p=document.createElement('p'); p.className='notice warn'; p.textContent=`이전 판이 끝나기 전에 종료되어 배팅 ${fmt(f)}골드를 잃었습니다.`; $('screen-main').appendChild(p); } }
showScreen('main');
</script>
</body>
